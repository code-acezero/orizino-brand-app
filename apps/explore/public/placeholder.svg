<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" fill="none">
  <defs>
    <!-- Cherry Cola Deep Rich Radial Gradient -->
    <radialGradient id="cherryGlow" cx="50%" cy="45%" r="65%" fx="50%" fy="45%">
      <stop offset="0%" stop-color="#5a0004" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#320103" stop-opacity="0.98" />
      <stop offset="85%" stop-color="#190001" />
      <stop offset="100%" stop-color="#0a0001" />
    </radialGradient>

    <!-- Linear Background Sheen -->
    <linearGradient id="cherrySheen" x1="0" y1="0" x2="1200" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6e0005" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6" />
    </linearGradient>

    <!-- Logo White Shadow & Soft Glow -->
    <filter id="whiteLogoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#ffffff" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="0" stdDeviation="48" flood-color="#ff1a22" flood-opacity="0.45" />
    </filter>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="ambientWhite" cx="50%" cy="46%" r="28%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="1200" fill="url(#cherryGlow)" />
  <rect width="1200" height="1200" fill="url(#cherrySheen)" />

  <!-- Ambient Light Circle Behind Logo -->
  <circle cx="600" cy="540" r="280" fill="url(#ambientWhite)" />

  <!-- Elegant Architectural Corner Accents -->
  <g opacity="0.2" stroke="#ffffff" stroke-width="1.5">
    <path d="M 60 100 L 60 60 L 100 60" />
    <path d="M 1140 100 L 1140 60 L 1100 60" />
    <path d="M 60 1100 L 60 1140 L 100 1140" />
    <path d="M 1140 1100 L 1140 1140 L 1100 1140" />
  </g>

  <!-- White ORIZINO Brand Logo with Shadow -->
  <g transform="translate(460, 395) scale(0.52)" filter="url(#whiteLogoShadow)">
    <g fill="#FFFFFF" fill-opacity="0.88">
      <path d="M11.31,303.01l10.42,10.61,102.73,114.11c-16.27-34.27-34.28-66.2-53.79-98.11L0,219.52l41.25-42.82,104.13-107.09C169.3,45.99,192.23,22.22,218.19,0l-71.11,101.28L55.74,232.06c26,65.57,52.95,130.16,81.76,194.32l12.16,25.25,71.16,112.86L52.01,416.82l-40.7-113.8Z"/>
      <path d="M510.24,351.74l-23.18,64.87-169.05,148.54,27.52-44.45,45.28-70.91,30.12-65.82,16.7-38.98,46-113.02-81.21-116.77-25.93-36.85L321.38.16c14.41,11.93,26.61,24.47,40.1,37.05l86.76,87.48,77.26,80.22,13.77,14.47-52.64,81.42c-26.66,41.23-50.32,83.4-72.56,127.58l33.83-36.98,79.5-88.8-17.16,49.14Z"/>
      <path d="M356.28,185.04l26.95,46.73-36.12,40.33-32.01,35.6-5.9,33.94-22.1,115.86-19.75,106.98-25.06-136.06-23.26-120.77-10.57-11.82-57.13-64.08,17.38-30.41,40.24-67.6c-.28,10.99,4.75,22.09,2.63,32.95l-18.99,63.2,44.02,68.95,9.75,55.81,20.97,113.31,20.22-107.91,10.47-61.52,44.22-68.68-19.37-63.68,2.55-32.17,30.86,51.02Z"/>
    </g>
  </g>

  <!-- Luxury Brand Typography -->
  <text x="600" y="745" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        fill-opacity="0.65"
        font-family="system-ui, -apple-system, 'Helvetica Neue', sans-serif" 
        font-weight="800" 
        font-size="28" 
        letter-spacing="0.32em">ORIZINO</text>
</svg>
